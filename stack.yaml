resolver: lts-24.48
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - crypto-token-0.2.0@rev:2
  - crypton-asn1-encoding-0.10.0
  - crypton-asn1-parse-0.10.0
  - crypton-asn1-types-0.4.1
  - crypton-2.1.7
  - crypton-x509-1.9.2
  - crypton-x509-store-1.9.0@rev:2
  - crypton-x509-system-1.9.0
  - crypton-x509-validation-1.9.1@rev:3
  - hpke-0.2.1
  - http-semantics-0.4.0
  - http2-5.4.0
  - http3-0.1.3
  - mlkem-0.2.2.0
  - network-3.2.9.0
  - quic-0.3.15
  - ram-0.22.0
  - sockaddr-0.0.1
  - time-hourglass-0.3.0
  - tls-2.4.8
  - tls-session-manager-0.1.0
allow-newer: true
allow-newer-deps:
  - http2
  - http3
