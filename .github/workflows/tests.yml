name: Tests

on:
  push:
    branches: ["master", "ci"]
  pull_request:
    branches: ["master"]

jobs:
  stack:
    name: Stack
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MANUAL_RESET: "v4"
      GHCUP_BIN_PATH_UNIX: "~/.ghcup/bin"
      STACK_PATH_LOCAL: ".stack-work"
      GHCUP_PATH_WINDOWS: "C:\\ghcup"
      GHCUP_PATH_UNIX: "~/.ghcup"

    strategy:
      fail-fast: false
      matrix:
        # os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["macos-latest"]
        stack: ["latest"]
        resolver:
          - "nightly" # 9.12
          - "lts-24" #  9.10
          - "lts-23" #  9.8
          - "lts-22" #  9.6
          - "lts-21" #  9.4
          - "lts-20" #  9.2

    steps:
      - name: "Set ENV vars per LTS"
        id: env-vars
        run: |
          # First we decide which GHC and which LTS we build with

          STACKYAML="stack.yaml"
          GHC_VERSION="9.12"
          case "${{ matrix.resolver }}" in
            "nightly")
              STACKYAML="stack-nightly.yaml"
              ;;
            "lts-24")
              GHC_VERSION="9.10"
              ;;
            "lts-23")
              GHC_VERSION="9.8"
              STACKYAML="stack-lts-23.yaml"
              ;;
            "lts-22")
              GHC_VERSION="9.6"
              STACKYAML="stack-lts-22.yaml"
              ;;
            "lts-21")
              GHC_VERSION="9.4"
              STACKYAML="stack-lts-21.yaml"
              ;;
            "lts-20")
              GHC_VERSION="9.2"
              STACKYAML="stack-lts-20.yaml"
              ;;
            *)
              ;;
          esac

          # And then we expose these variables in the 'env'
          echo "STACKYAML=$STACKYAML" >> $GITHUB_ENV
          echo "STACKYAMLLOCK=${STACKYAML}.lock" >> $GITHUB_ENV
          echo "GHC_VERSION=$GHC_VERSION" >> $GITHUB_ENV
          # On MacOS, this is sometimes not in the path after caching
          echo "$HOME/.ghcup/bin" >> $GITHUB_PATH

      - name: Clone project
        id: checkout-code
        uses: actions/checkout@v6

      - name: Cache GHCup Unix
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v6
        id: ghcup-cache-unix
        with:
          path: |
            ${{ env.GHCUP_PATH_UNIX }}/bin/*
            ${{ env.GHCUP_PATH_UNIX }}/cache/*
            ${{ env.GHCUP_PATH_UNIX }}/config.yaml
            ${{ env.GHCUP_PATH_UNIX }}/ghc/${{ env.GHC_VERSION }}.*
            ${{ env.GHCUP_PATH_UNIX }}/stack/*
          key: CI-ghcup-unix-${{ matrix.os }}-${{ env.MANUAL_RESET }}-${{ env.GHC_VERSION }}
          restore-keys: |
            ghcup-${{ matrix.os }}-

      - name: Cache GHCup Windows
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6
        id: ghcup-cache-windows
        with:
          path: |
            ${{ env.GHCUP_PATH_WINDOWS }}\bin\*
            ${{ env.GHCUP_PATH_WINDOWS }}\cache\*
            ${{ env.GHCUP_PATH_WINDOWS }}\config.yaml
            ${{ env.GHCUP_PATH_WINDOWS }}\ghc\${{ env.GHC_VERSION }}.*
            ${{ env.GHCUP_PATH_WINDOWS }}\stack\*
            %APPDATA%\stack
            %LOCALAPPDATA%\Programs\stack
          key: CI-ghcup-windows-${{ env.MANUAL_RESET }}-${{ env.GHC_VERSION }}

      - name: Setup Haskell Stack
        id: ghcup-install
        uses: haskell-actions/setup@v2
        if: >
          (matrix.os == 'windows-latest' && steps.ghcup-cache-windows.outputs.cache-hit != 'true')
            || (matrix.os != 'windows-latest' && steps.ghcup-cache-unix.outputs.cache-hit != 'true')
        with:
          stack-version: "${{ matrix.stack }}"
          ghc-version: ${{ env.GHC_VERSION }}
          enable-stack: true
          stack-setup-ghc: false

      # For some reason, GHCup on MacOS runners does not put 'stack' in the '.ghcup' directory
      - name: Copy Stack for MacOS
        id: stack-copy-macos
        if: matrix.os == 'macos-latest' && steps.ghcup-cache-unix.outputs.cache-hit != 'true'
        run: |
          cp "${{ steps.ghcup-install.outputs.stack-exe }}" "$HOME/.ghcup/bin"

      - name: Cache Pantry (Stackage package index) Unix
        if: matrix.os != 'windows-latest'
        id: pantry-unix
        uses: actions/cache@v6
        with:
          path: ~/.stack/pantry
          key: CI-pantry-unix-${{ matrix.os }}-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}

      - name: Cache Pantry (Stackage package index) Windows
        if: matrix.os == 'windows-latest'
        id: pantry-windows
        uses: actions/cache@v6
        with:
          path: "C:\\sr\\pantry"
          key: CI-pantry-windows-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}

      - name: Recompute Stackage package index
        if: >
          (matrix.os == 'windows-latest' && steps.pantry-windows.outputs.cache-hit != 'true')
            || (matrix.os != 'windows-latest' && steps.pantry-unix.outputs.cache-hit != 'true')
        id: pantry-install
        run: |
          # FOR DEBUGGING PURPOSES
          if [[ "${{ matrix.os }}" == 'macos-latest' ]]; then
            which stack || echo "which failed"
            which ${{ env.GHCUP_PATH_UNIX }}/bin/stack || echo "specific which failed"
            ls -la ${{ env.GHCUP_PATH_UNIX }}/bin || "ls failed!?"
            find ~ -iname stack 2> /dev/null || echo "find failed"
            stack --version
          fi
          stack update --stack-yaml="${{ env.STACKYAML }}" # populates ~/.stack/pantry

      - name: Cache Dependencies Unix
        if: matrix.os != 'windows-latest'
        id: deps-unix
        uses: actions/cache@v6
        with:
          path: |
            ~/.stack/stack.sqlite3
            ~/.stack/snapshots
          key: CI-deps-unix-${{ matrix.os }}-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}-${{ hashFiles(env.STACKYAMLLOCK) }}
          restore-keys: |
            CI-deps-unix-${{ matrix.os }}-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}-
            CI-deps-unix-${{ matrix.os }}-${{ env.MANUAL_RESET }}-

      - name: Cache Dependencies Windows
        if: matrix.os == 'windows-latest'
        id: deps-windows
        uses: actions/cache@v6
        with:
          path: |
            C:\sr\stack.sqlite3
            C:\sr\snapshots
          key: CI-deps-windows-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}-${{ hashFiles(env.STACKYAMLLOCK) }}
          restore-keys: |
            CI-deps-windows-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}-
            CI-deps-windows-${{ env.MANUAL_RESET }}-

      - name: Build dependencies
        if: >
          (matrix.os == 'windows-latest' && steps.deps-windows.outputs.cache-hit != 'true')
            || (matrix.os != 'windows-latest' && steps.deps-unix.outputs.cache-hit != 'true')
        id: deps-install
        run: |
          EXTRA=""
          if [[ ${{ matrix.os }} = "windows-latest" ]]; then
            EXTRA="--flag=entropy:donotgetentropy"
          fi
          stack config set system-ghc true --global
          stack build --only-dependencies \
            --resolver=${{ matrix.resolver }} \
            --test --bench --no-run-tests --no-run-benchmarks \
            --ghc-options='-Wall' $EXTRA \
            --stack-yaml ${{ env.STACKYAML }}

      # Let's also try caching the build artifacts, so that rebuilds might go faster as well.
      - name: Cache Local Files
        id: local-files-restore
        uses: actions/cache/restore@v6
        with:
          path: "${{ env.STACK_PATH_LOCAL }}"
          key: CI-locals-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}-${{ github.ref_name }}
          restore-keys: |
            CI-locals-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}
            CI-locals-${{ env.MANUAL_RESET }}-

      - name: Build
        id: build-code
        run: |
          # FOR DEBUGGING PURPOSES
          if [[ "${{ matrix.os }}" == 'macos-latest' ]]; then
            which stack || echo "which failed"
            which ${{ env.GHCUP_PATH_UNIX }}/bin/stack || echo "specific which failed"
            ls -la ${{ env.GHCUP_PATH_UNIX }}/bin
            find ~ -iname stack 2> /dev/null || echo "find failed"
            stack --version
          fi
          stack config set system-ghc true --global
          stack build \
            --system-ghc \
            --resolver=${{ matrix.resolver }} \
            --test --bench --no-run-tests --no-run-benchmarks \
            --ghc-options='-Wall' \
            --stack-yaml ${{ env.STACKYAML }}

      - name: Cache Local Files
        id: local-files-save
        uses: actions/cache/save@v6
        with:
          path: "${{ env.STACK_PATH_LOCAL }}"
          key: CI-locals-${{ env.MANUAL_RESET }}-${{ matrix.resolver }}-${{ github.ref_name }}

      - name: Run tests
        # Remove this after we've had a successful cache run
        if: matrix.os != 'windows-latest'
        id: run-tests
        run: |
          stack config set system-ghc true --global
          stack test \
            --system-ghc \
            --no-terminal \
            --resolver ${{ matrix.resolver }} \
            --haddock --no-haddock-deps \
            --no-run-benchmarks \
            --stack-yaml ${{ env.STACKYAML }}
