resolver: nightly
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  - http-semantics-0.4.2
  - network-3.2.12.0
  # TEMPORARY: http2 with confTimeout (kazu-yamamoto/http2#213), until it
  # is released. Revert to a Hackage version before merging.
  - git: https://github.com/kazu-yamamoto/http2
    commit: 0b5130714c004572ea68049953ef6fdfee88d47b
  - http3-0.1.9
  - quic-0.3.18
  - crypton-2.1.10
allow-newer: true
allow-newer-deps:
  - http2
  - http3
