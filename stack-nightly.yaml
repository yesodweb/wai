resolver: nightly
packages:
  - ./auto-update
  - ./mime-types
  - ./recv
  - ./time-manager
  - ./wai
  - ./wai-app-static
  - ./wai-conduit
  - ./wai-extra
  - ./wai-frontend-monadcgi
  - ./wai-http2-extra
  - ./wai-websockets
  - ./warp
  - ./warp-quic
  - ./warp-tls
flags:
  wai-extra:
    build-example: true
nix:
  enable: false
  packages:
    - fcgi
    - zlib
extra-deps:
  # TEMPORARY: http2 with confWatchdog (kazu-yamamoto/http2#213), until it
  # is released. Revert to a Hackage version before merging.
  - git: https://github.com/kazu-yamamoto/http2
    commit: c8f6c7d0ef2c9c3b0bd65ab2484f734de8131ddf
allow-newer: true
allow-newer-deps:
  - http2
  - http3
